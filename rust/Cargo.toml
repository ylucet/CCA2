[package]
name = "cca2"
version = "0.1.0"
edition = "2021"
description = "Exact conjugate and biconjugate of bivariate PLQ functions"
license = "GPL-3.0-or-later"

[dependencies]
num-bigint = { version = "0.4", features = ["std"] }
num-rational = { version = "0.4", features = ["std"] }
num-integer = { version = "0.1", features = ["std"] }
num-traits = { version = "0.2", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }


[profile.release]
debug = 1
